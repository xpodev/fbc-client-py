[project]
name = "xpo-feedback"
version = "0.1.0"
description = "Client for the Xpo Feedback Center: feedback, support requests, error reports and analytics."
readme = "README.md"
requires-python = ">=3.9"
dependencies = []
license = { text = "Proprietary" }
keywords = ["feedback", "error-reporting", "crash-reporting", "analytics", "support"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/xpodev/fbc-client-py"
Issues = "https://github.com/xpodev/fbc-client-py/issues"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/xpo_feedback"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
