[project]
name = "xpo-feedback"
version = "0.1.0"
description = "Client for the Xpo Feedback Center: feedback, support requests, error reports and analytics."
readme = "README.md"
requires-python = ">=3.9"
dependencies = []
license = { text = "Proprietary" }

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/xpo_feedback"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
